<!DOCTYPE html>
<html>

<head>

<title>Workforce Stability Prediction</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:Segoe UI;
background:#f4f7fc;
}

/* NAVBAR */

.navbar{
height:60px;
background:#1f2937;
color:white;
display:flex;
align-items:center;
padding:0 25px;
font-size:20px;
font-weight:bold;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:60px;
left:0;
width:220px;
height:100%;
background:#111827;
padding-top:20px;
}

.sidebar a{
display:block;
color:white;
padding:14px 20px;
text-decoration:none;
font-size:15px;
}

.sidebar a:hover{
background:#2563eb;
}

/* CONTENT */

.content{
margin-left:220px;
padding:30px;
}

/* CARDS */

.card{
display:inline-block;
background:white;
padding:30px;
margin:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-decoration:none;
color:#333;
font-size:18px;
width:220px;
text-align:center;
}

.card:hover{
background:#3b82f6;
color:white;
}

/* PROCESS BUTTONS */

.process a{
display:block;
background:#3b82f6;
color:white;
padding:14px;
margin:12px 0;
border-radius:6px;
text-decoration:none;
width:300px;
}

.process a:hover{
background:#1f4e79;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1f4e79;
color:white;
}

/* FOOTER */

footer{
margin-top:30px;
padding:15px;
background:#1f2937;
color:white;
text-align:center;
}

</style>

</head>

<body>

<div class="navbar">
<i class="fa fa-chart-line"></i> Workforce Stability AI System
</div>

<div class="sidebar">

<a href="/dashboard"><i class="fa fa-home"></i> Dashboard</a>

<a href="/users"><i class="fa fa-users"></i> Manage Users</a>

<a href="/train_model"><i class="fa fa-brain"></i> Train Model</a>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

<footer>

© 2026 Workforce Stability Prediction System

</footer>

</body>
</html>
