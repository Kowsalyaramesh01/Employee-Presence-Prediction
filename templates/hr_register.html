<!DOCTYPE html>
<html lang="en">
<head>
<title>HR Register - Workforce Stability Prediction</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link href="https://fonts.googleapis.com/css?family=Montserrat:200,300,400,500,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

<link rel="stylesheet" href="../static/assets/css/style.css">

<style>

.hero-wrap{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding-top:120px;
}

.hr-box{
background:white;
padding:35px;
border-radius:12px;
box-shadow:0px 15px 45px rgba(0,0,0,0.25);
max-width:650px;
width:100%;
margin:auto;
}

.hr-box h3{
font-weight:700;
margin-bottom:25px;
text-align:center;
}

/* 🔥 GRID FORM (2 COLUMNS) */
.form-grid{
display:grid;
grid-template-columns: 1fr 1fr;
gap:15px;
}

/* Full width elements */
.full-width{
grid-column: span 2;
}

.hr-box input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

.hr-box button{
width:100%;
padding:13px;
background:#070dd1;
border:none;
color:white;
font-weight:600;
border-radius:6px;
font-size:16px;
}

.hr-box button:hover{
background:#0505c9;
}

.login-link{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>
<!-- Top Contact Bar -->
<div class="wrap">
<div class="container">
<div class="row justify-content-between">
<div class="col-12 col-md d-flex align-items-center">
<p class="mb-0 phone">
<span class="mailus">Phone no:</span> +00 1234 567 
or <span class="mailus">email us:</span> emailsample@email.com
</p>
</div>

<div class="col-12 col-md d-flex justify-content-md-end">
<div class="social-media">
<p class="mb-0 d-flex">
<a href="#"><span class="fa fa-facebook"></span></a>
<a href="#"><span class="fa fa-twitter"></span></a>
<a href="#"><span class="fa fa-instagram"></span></a>
</p>
</div>
</div>
</div>
</div>
</div>


<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light">

<div class="container">

<a class="navbar-brand" href="/">Workforce<span>AI</span></a>

<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
<span class="oi oi-menu"></span> Menu
</button>

<div class="collapse navbar-collapse" id="ftco-nav">
<ul class="navbar-nav ml-auto">

<li class="nav-item">
<a href="/" class="nav-link">Home</a>
</li>
<li class="nav-item ">
<a href="/admin" class="nav-link">Admin</a>
</li>
<li class="nav-item active">
<a href="/login" class="nav-link">HR Register</a>
</li>

</ul>
</div>

</div>
</nav>
<!-- Hero -->
<div class="hero-wrap" style="background-image: url('../static/assets/images/bg_1.jpg'); background-size:cover; background-position:center;">
<div class="overlay"></div>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-8">

<div class="hr-box">

<h3>
<i class="fa fa-user-plus"></i> HR Registration
</h3>

<form method="POST">

<div class="form-grid">

<input type="text" name="name" placeholder="Full Name" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required class="full-width">

<button type="submit" class="full-width">
Register
</button>

</div>

</form>

<div class="login-link">
<p>Already have an account? <a href="/login">Login here</a></p>
</div>

</div>

</div>
</div>
</div>
</div>

</body>
</html>
