<!DOCTYPE html>
<html>
<head>

<title>Predict Attrition - WorkforceAI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#f4f7fb;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:240px;
height:100vh;
background:#081b4b;
position:fixed;
left:0;
top:0;
padding:25px 15px;
color:white;
}

.sidebar h2{
text-align:center;
margin-bottom:40px;
}

.sidebar a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:12px;
border-radius:10px;
color:white;
text-decoration:none;
transition:0.3s;
}

.sidebar a:hover,
.sidebar a.active{
background:white;
color:#2f3cc8;
}

/* MAIN */

.main{
margin-left:240px;
width:100%;
}

/* NAVBAR */

.navbar{
background:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.logo{
font-size:22px;
font-weight:bold;
color:#2f3cc8;
}

/* FORM CONTAINER */

.form-container{
padding:30px 40px;
}

.form-card{
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.form-card h2{
margin-bottom:25px;
}

/* GRID FORM */

.form-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

/* INPUT GROUP */

.form-group{
display:flex;
flex-direction:column;
}

.form-group label{
font-size:13px;
font-weight:600;
margin-bottom:5px;
color:#444;
}

.form-group input,
.form-group select{
padding:10px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
}

/* FULL WIDTH */

.full{
grid-column:span 3;
}

/* BUTTON */

button{
background:linear-gradient(135deg,#5663ff,#2f3cc8);
color:white;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

button:hover{
transform:translateY(-2px);
}

/* BULK BOX */

.upload-box{
border:2px dashed #2f3cc8;
padding:50px;
border-radius:15px;
text-align:center;
background:#f8f9ff;
margin: 20px;
}

.upload-box i{
font-size:40px;
color:#2f3cc8;
}

/* RESPONSIVE */

@media(max-width:1000px){
.form-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){
.form-grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="sidebar">
<h2>WorkforceAI</h2>

<a href="/hr_dashboard"><i class="fa fa-chart-line"></i> Dashboard</a>
<a href="/predict" class="active"><i class="fa fa-search"></i> Predict</a>
<a href="/history"><i class="fa fa-clock"></i> History</a>
<a href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main">

<div class="navbar">
<div class="logo">Predict Attrition</div>
<div>Welcome HR</div>
</div>

<div class="form-container">

<div class="form-card">

<h2>Employee Attrition Prediction</h2>

<form method="post" enctype="multipart/form-data">

<!-- DROPDOWN -->
<div class="form-group full">
<label>Prediction Type</label>
<select name="prediction_type" id="predictionType" onchange="toggleMode()">
<option value="single">Single Employee</option>
<option value="bulk">Bulk Upload (Excel)</option>
</select>
</div>

<!-- SINGLE FORM -->
<div id="singleForm" class="form-grid">

<div class="form-group">
<label>Age</label>
<input name="Age" type="number" placeholder="e.g. 35">
</div>

<div class="form-group">
<label>Gender</label>
<select name="Gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>

<div class="form-group">
<label>Department</label>
<input name="Department" placeholder="e.g. Sales / HR / IT">
</div>

<div class="form-group">
<label>Job Role</label>
<input name="Job_Role" placeholder="e.g. Data Scientist / Manager">
</div>

<div class="form-group">
<label>Education</label>
<input name="Education_Level" placeholder="e.g. Bachelor / Master / PhD">
</div>

<div class="form-group">
<label>Marital Status</label>
<input name="Marital_Status" placeholder="e.g. Single / Married">
</div>

<div class="form-group">
<label>Total Experience (Years)</label>
<input name="Total_Work_Experience" type="number" placeholder="e.g. 5">
</div>

<div class="form-group">
<label>Years at Company</label>
<input name="Years_At_Company" type="number" placeholder="e.g. 3">
</div>

<div class="form-group">
<label>Years in Role</label>
<input name="Years_In_Current_Role" type="number" placeholder="e.g. 2">
</div>

<div class="form-group">
<label>Monthly Salary</label>
<input name="Monthly_Salary" type="number" placeholder="e.g. 45000">
</div>

<div class="form-group">
<label>Salary Hike (%)</label>
<input name="Salary_Hike_Percent" type="number" placeholder="e.g. 10 - 20">
</div>

<div class="form-group">
<label>Job Level</label>
<input name="Job_Level" type="number" placeholder="e.g. 1 - 5">
</div>

<div class="form-group">
<label>Overtime</label>
<select name="Overtime">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>
</div>

<div class="form-group">
<label>Work Life Balance</label>
<input name="Work_Life_Balance" type="number" placeholder="1 (Low) - 4 (Excellent)">
</div>

<div class="form-group">
<label>Job Satisfaction</label>
<input name="Job_Satisfaction" type="number" step="0.1" placeholder="0.0 - 1.0">
</div>

<div class="form-group">
<label>Environment Satisfaction</label>
<input name="Environment_Satisfaction" type="number" step="0.1" placeholder="0.0 - 1.0">
</div>

<div class="form-group">
<label>Manager Relationship</label>
<input name="Relationship_With_Manager" type="number" placeholder="1 - 5">
</div>

<div class="form-group">
<label>Training Hours (Last Year)</label>
<input name="Training_Hours_Last_Year" type="number" placeholder="e.g. 20">
</div>

<div class="form-group">
<label>Performance Rating</label>
<input name="Performance_Rating" type="number" placeholder="1 - 5">
</div>

<div class="form-group">
<label>Distance From Home (km)</label>
<input name="Distance_From_Home" type="number" placeholder="e.g. 10">
</div>

<div class="form-group">
<label>Promotion Last 5 Years</label>
<select name="Promotion_Last_5_Years">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>
</div>

<div class="form-group">
<label>Absenteeism Rate (%)</label>
<input name="Absenteeism_Rate" type="number" step="0.1" placeholder="e.g. 2.5">
</div>

<div class="form-group">
<label>Stock Option</label>
<select name="Company_Stock_Option">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>
</div>

</div>

<!-- BULK FORM -->
<div id="bulkForm" style="display:none;">

<div class="upload-box">
<i class="fa fa-file-upload"></i>
<h3>Upload Excel File</h3>
<input type="file" name="file" accept=".xlsx,.csv">
</div>

</div>

<!-- BUTTON -->
<div class="form-group full">
<button type="submit">🔍 Predict Attrition</button>
</div>

</form>

</div>

</div>

</div>

<script>
function toggleMode(){
    let type = document.getElementById("predictionType").value;

    document.getElementById("singleForm").style.display =
        (type === "single") ? "grid" : "none";

    document.getElementById("bulkForm").style.display =
        (type === "bulk") ? "block" : "none";
}
</script>

</body>
</html>
