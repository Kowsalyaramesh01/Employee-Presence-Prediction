<!DOCTYPE html>
<html>
<head>

<title>Attrition Distribution - WorkforceAI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#f4f7fb;
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:240px;
height:100vh;
background:#081b4b;
position:fixed;
left:0;
top:0;
padding:25px 15px;
color:white;
}

.sidebar h2{
text-align:center;
margin-bottom:40px;
}

.sidebar a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:12px;
border-radius:10px;
color:white;
text-decoration:none;
transition:0.3s;
}

.sidebar a:hover{
background:white;
color:#2f3cc8;
}

.sidebar a.active{
background:white;
color:#2f3cc8;
font-weight:bold;
}

/* MAIN */

.main{
margin-left:240px;
width:calc(100% - 240px);
padding-bottom:40px;
}

/* NAVBAR */

.navbar{
background:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* HEADER */

.page-header{
padding:30px 40px;
}

.page-header h2{
font-size:28px;
color:#333;
}

/* CARDS */

.cards{
display:flex;
gap:30px;
padding:0 40px;
margin-bottom:30px;
}

.card{
flex:1;
padding:30px;
border-radius:16px;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card h3{
font-size:18px;
margin-bottom:15px;
}

.card p{
font-size:42px;
font-weight:bold;
}

.stay{
background:linear-gradient(135deg,#28c76f,#48da89);
}

.exit{
background:linear-gradient(135deg,#ea5455,#ff7b7b);
}

/* CHART SECTION */

.chart-section{
display:flex;
gap:30px;
padding:0 40px;
}

.chart-card{
flex:1;
background:white;
border-radius:16px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.chart-card h3{
margin-bottom:15px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h2>WorkforceAI</h2>

<a href="/dashboard">
<i class="fa fa-chart-line"></i> Dashboard
</a>



<a href="/classification" class="active">
<i class="fa fa-chart-pie"></i> Classification
</a>

<a href="/logout">
<i class="fa fa-sign-out-alt"></i> Logout
</a>

</div>

<!-- MAIN -->

<div class="main">

<div class="navbar">
<b>Classification Results</b>
<div>Admin Panel</div>
</div>

<div class="page-header">
<h2><i class="fa fa-chart-pie"></i> Attrition Distribution</h2>
</div>

<!-- STAT CARDS -->

<div class="cards">

<div class="card stay">

<h3><i class="fa fa-user-check"></i> Employees Staying</h3>

<p>{{stay_count}}</p>

</div>


<div class="card exit">

<h3><i class="fa fa-user-times"></i> Employees Exiting</h3>

<p>{{exit_count}}</p>

</div>

</div>

<!-- CHARTS -->

<div class="chart-section">

<div class="chart-card">

<h3>Attrition Pie Chart</h3>

<div id="piechart"></div>

</div>


<div class="chart-card">

<h3>Attrition Bar Chart</h3>

<div id="barchart"></div>

</div>

</div>

</div>


<script>

/* PIE CHART */

var pieOptions = {

series:[{{stay_count}}, {{exit_count}}],

chart:{
type:'pie',
height:350
},

labels:['Staying','Exiting'],

colors:['#28c76f','#ea5455']

};

var pie = new ApexCharts(document.querySelector("#piechart"), pieOptions);
pie.render();


/* BAR CHART */

var barOptions = {

series:[{
name:'Employees',
data:[{{stay_count}}, {{exit_count}}]
}],

chart:{
type:'bar',
height:350
},

xaxis:{
categories:['Staying','Exiting']
},

colors:['#2f3cc8']

};

var bar = new ApexCharts(document.querySelector("#barchart"), barOptions);
bar.render();

</script>

</body>
</html>
